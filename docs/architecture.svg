<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Tauhaulity scan flow and containment layer</title>
  <desc id="diagram-desc">Generated diagram of one scan. The left column lists the twelve read only pillar probes by stage: environment, supply chain, runtime and reporting. The middle flow runs from the target project to evidence and then to the dossier. The right panel is the containment layer: shield, quarantine, commit gate and canary farm, every one opt in and reversible. The footer states the boundary: detection is broad, prevention is narrow and opt in.</desc>
