  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="54" font-size="21" font-weight="600" letter-spacing="0.5" fill="#c9d1d9">SCAN FLOW AND CONTAINMENT</text>
    <text x="40" y="78" font-size="12" fill="#8b949e">twelve read only pillar probes, one dossier, a narrow containment layer</text>
    <text x="40" y="116" font-size="10" letter-spacing="1.6" fill="#8b949e">PILLAR SWEEP BY STAGE</text>
    <text x="40" y="140" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#58a6ff">ENVIRONMENT</text>
    <text x="278" y="140" font-size="9.5" text-anchor="end" fill="#8b949e">host and interpreter integrity</text>
    <text x="54" y="162" font-size="9.5" fill="#c9d1d9">P01 memory and GOT/IAT</text>
    <text x="54" y="186" font-size="9.5" fill="#c9d1d9">P02 syscall boundary</text>
    <text x="54" y="210" font-size="9.5" fill="#c9d1d9">P03 privilege gate</text>
    <text x="54" y="234" font-size="9.5" fill="#c9d1d9">P05 in-memory keys</text>
    <text x="40" y="254" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#d29922">SUPPLY CHAIN</text>
    <text x="278" y="254" font-size="9.5" text-anchor="end" fill="#8b949e">code and dependency trust</text>
    <text x="54" y="276" font-size="9.5" fill="#c9d1d9">P06 package and pickle gate</text>
    <text x="54" y="300" font-size="9.5" fill="#c9d1d9">P10 venv and shard radar</text>
    <text x="54" y="324" font-size="9.5" fill="#c9d1d9">P11 git sentinel and gate</text>
    <text x="40" y="344" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#3fb950">RUNTIME</text>
    <text x="278" y="344" font-size="9.5" text-anchor="end" fill="#8b949e">live behaviour in the project</text>
    <text x="54" y="366" font-size="9.5" fill="#c9d1d9">P04 mirage readiness</text>
    <text x="54" y="390" font-size="9.5" fill="#c9d1d9">P07 egress leak detection</text>
    <text x="54" y="414" font-size="9.5" fill="#c9d1d9">P08 undo ring and canaries</text>
    <text x="54" y="438" font-size="9.5" fill="#c9d1d9">P09 ports and process lineage</text>
    <text x="40" y="458" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#bc8cff">REPORTING</text>
    <text x="278" y="458" font-size="9.5" text-anchor="end" fill="#8b949e">evidence that leaves the run</text>
    <text x="54" y="480" font-size="9.5" fill="#c9d1d9">P12 repro synthesis</text>
    <text x="332" y="160" font-size="12.5" font-weight="600" letter-spacing="0.8" fill="#58a6ff">TARGET PROJECT</text>
    <text x="332" y="180" font-size="10" fill="#c9d1d9">the directory you point at</text>
    <text x="332" y="196" font-size="9.5" fill="#8b949e">nothing is written outside it</text>
    <text x="332" y="316" font-size="12.5" font-weight="600" letter-spacing="0.8" fill="#3fb950">EVIDENCE</text>
    <text x="332" y="336" font-size="10" fill="#c9d1d9">twelve read only pillar findings</text>
    <text x="332" y="352" font-size="9.5" fill="#8b949e">bounded score and deduction ledger</text>
    <text x="332" y="442" font-size="12.5" font-weight="600" letter-spacing="0.8" fill="#bc8cff">DOSSIER</text>
    <text x="332" y="462" font-size="10" fill="#c9d1d9">md, txt and json with an HMAC stamp</text>
    <text x="332" y="478" font-size="9.5" fill="#8b949e">the report you keep and verify</text>
    <text x="676" y="138" font-size="12" font-weight="600" letter-spacing="0.6" fill="#c9d1d9">CONTAINMENT LAYER</text>
    <text x="676" y="158" font-size="9.5" fill="#8b949e">opt in, reversible, armed by you</text>
    <text x="688" y="194" font-size="11.5" font-weight="600" fill="#58a6ff">shield</text>
    <text x="688" y="210" font-size="9.5" fill="#8b949e">denies third party sockets</text>
    <text x="688" y="224" font-size="9.5" fill="#8b949e">process spawns and secret reads</text>
    <text x="688" y="274" font-size="11.5" font-weight="600" fill="#d29922">quarantine</text>
    <text x="688" y="290" font-size="9.5" fill="#8b949e">moves a dangerous artefact</text>
    <text x="688" y="304" font-size="9.5" fill="#8b949e">out of the load path, reversible</text>
    <text x="688" y="354" font-size="11.5" font-weight="600" fill="#f85149">commit gate</text>
    <text x="688" y="370" font-size="9.5" fill="#8b949e">blocks a staged credential</text>
    <text x="688" y="384" font-size="9.5" fill="#8b949e">before the commit is created</text>
    <text x="688" y="434" font-size="11.5" font-weight="600" fill="#bc8cff">canary farm</text>
    <text x="688" y="450" font-size="9.5" fill="#8b949e">alerts on the first read</text>
    <text x="688" y="464" font-size="9.5" fill="#8b949e">of a deployed decoy file</text>
    <text x="480" y="549" font-size="12.5" text-anchor="middle" fill="#c9d1d9">Detection is broad, prevention is narrow and opt in.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace">
    <text x="882" y="192.5" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.6" fill="#d29922">OPT IN</text>
    <text x="882" y="272.5" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.6" fill="#d29922">OPT IN</text>
    <text x="882" y="352.5" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.6" fill="#d29922">OPT IN</text>
    <text x="882" y="432.5" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.6" fill="#d29922">OPT IN</text>
    <text x="52" y="549" font-size="9.5" fill="#8b949e">TAUHAULITY 0.4.0</text>
  </g>
</svg>
