name: Security lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow security (zizmor + actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install zizmor
        run: python -m pip install --upgrade pip zizmor

      - name: zizmor
        continue-on-error: true
        run: zizmor --format plain .github/workflows

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          fail-on-error: false

  python-sast:
    name: Python SAST (bandit + ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install --upgrade pip bandit ruff

      - name: bandit
        continue-on-error: true
        run: bandit -q -r tauhaulity

      - name: ruff security rules
        continue-on-error: true
        run: ruff check --select S --output-format concise tauhaulity scripts

  secrets-and-files:
    name: Secret and file scanning (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scanners: secret,misconfig,vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-fs.txt

      - name: Show Trivy report
        if: always()
        run: cat trivy-fs.txt || true

  rust-audit:
    name: Rust advisory (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Install cargo audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        continue-on-error: true
        working-directory: rust_silicon_shield
        run: cargo audit || true
