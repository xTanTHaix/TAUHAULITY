[build-system]
requires = []
build-backend = ""

[project]
name = "tauhaulity"
version = "0.4.1"
description = "12-pillar project safety scan with containment, OSV advisories, quarantine, undo net and dossier exporter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tauhaulity contributors" }]
keywords = ["security", "supply-chain", "static-analysis", "ransomware", "developer-tools"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
tauhaulity = "tauhaulity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not slow and not corpus"'
markers = [
  "slow: long running torture and asset integrity tests",
  "corpus: the red-team, usage and runtime corpora",
  "integration: exercises real subprocesses and platform primitives",
]
